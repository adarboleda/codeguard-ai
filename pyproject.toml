[project]
name = "codeguard-ai"
version = "0.1.0"
description = "Genera, filtra y evalúa pruebas pytest desde contratos YAML, con cobertura, mutantes y alertas estáticas."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
authors = [{ name = "Abner Arboleda" }, { name = "Christian Bonifaz" }, { name = "Marcelo Acuña" }]
dependencies = [
    "pytest>=8,<9",
    "pytest-cov>=6",
    "coverage[toml]>=7,<8",
    "pyyaml>=6",
    "pydantic>=2,<3",
    "jinja2>=3,<4",
    "typer>=0.12",
    "bandit>=1.8,<1.9",
]

[project.optional-dependencies]
# Extensión opcional con Groq (CG-31): apagada por defecto, el núcleo no la necesita.
llm = ["openai>=1.40", "python-dotenv>=1"]

[project.scripts]
codeguard = "codeguard.cli.main:app"

[dependency-groups]
dev = ["ruff>=0.8", "mypy>=1.13", "pre-commit>=4", "types-pyyaml"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codeguard"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "reference", "tests"]
extend-exclude = ["out"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "N",       # nombres PEP 8
    "UP",      # sintaxis moderna
    "B",       # bugbear
    "SIM",     # simplificaciones
    "C90",     # complejidad ciclomática
    "RUF",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Ejemplos inseguros a propósito para las reglas CG001/CG002 (CG-15).
"samples/security/**" = ["S", "B", "F"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
mypy_path = ["src", "reference"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

# Equivalente a --strict solo en domain/ y application/ (plan, sección 3).
[[tool.mypy.overrides]]
module = ["codeguard.domain.*", "codeguard.application.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

# ---------------------------------------------------------------- pytest y coverage
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["reference"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

# Cobertura del propio CodeGuard (CG-25). La cobertura objetivo de sciref la mide el pipeline aparte.
[tool.coverage.run]
branch = true
source = ["codeguard"]

[tool.coverage.report]
show_missing = true
skip_empty = true
